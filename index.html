<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Neon Arena Shooter</title>
<style>
  :root { --bg:#07070f; --fg:#e8f1ff; --accent:#00e5ff; --pink:#ff2bd6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas { display:block; width:100vw; height:100vh; cursor:crosshair; }
  #hud { position:fixed; top:12px; left:16px; right:16px; display:flex; justify-content:space-between; pointer-events:none;
    font-weight:700; letter-spacing:.05em; text-shadow:0 0 8px var(--accent); font-size:15px; }
  #hpbar { width:160px; height:10px; border:1px solid var(--accent); border-radius:6px; overflow:hidden; margin-top:6px; }
  #hpfill { height:100%; background:linear-gradient(90deg,var(--pink),var(--accent)); width:100%; transition:width .15s; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    background:rgba(7,7,15,.82); text-align:center; padding:16px; }
  .overlay.hidden { display:none; }
  h1 { font-size:clamp(32px,8vw,64px); color:var(--accent); text-shadow:0 0 18px var(--accent), 0 0 40px var(--pink); }
  p { opacity:.85; max-width:480px; line-height:1.5; }
  button { font:inherit; font-weight:800; font-size:20px; padding:12px 36px; border-radius:999px; border:2px solid var(--accent);
    background:transparent; color:var(--accent); cursor:pointer; box-shadow:0 0 16px var(--accent); }
  button:hover { background:var(--accent); color:var(--bg); }
  kbd { border:1px solid #fff5; border-radius:4px; padding:1px 6px; font-size:13px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div>SCORE <span id="score">0</span><div id="hpbar"><div id="hpfill"></div></div></div>
  <div style="text-align:right">WAVE <span id="wave">1</span><br><span style="font-size:12px;opacity:.8">BEST <span id="best">0</span></span></div>
</div>
<div id="menu" class="overlay">
  <h1>NEON ARENA</h1>
  <p>Sống sót qua các đợt kẻ địch càng lúc càng đông.<br>
    <kbd>W A S D</kbd> di chuyển · <b>chuột</b> ngắm · <b>giữ click</b> bắn · <kbd>P</kbd> tạm dừng<br>
    Điện thoại: kéo nửa trái để di chuyển, chạm nửa phải để ngắm &amp; bắn.</p>
  <p style="font-size:14px">Vật phẩm: <span style="color:#7CFF6B">● hồi máu</span> · <span style="color:#FFD23F">● bắn 3 tia</span> · <span style="color:#ff2bd6">● bắn nhanh</span></p>
  <button id="startBtn">CHƠI</button>
</div>
<div id="over" class="overlay hidden">
  <h1>GAME OVER</h1>
  <p id="overText"></p>
  <button id="againBtn">CHƠI LẠI</button>
</div>
<script>
(() => {
  const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
  const $ = id => document.getElementById(id);
  let W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cvs.width = W * DPR; cvs.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener('resize', resize); resize();

  const rand = (a, b) => a + Math.random() * (b - a);
  const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  let best = 0;
  try { best = +localStorage.getItem('neonArenaBest') || 0; } catch (e) {}
  $('best').textContent = best;

  // ---------- Audio (tiny synth, no assets) ----------
  let actx = null;
  function beep(freq, dur, type = 'square', vol = 0.05, slide = 0) {
    if (!actx) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), actx.currentTime + dur);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  }

  // ---------- Input ----------
  const keys = {};
  const mouse = { x: W / 2, y: H / 2, down: false };
  const touch = { moveId: null, mx0: 0, my0: 0, mdx: 0, mdy: 0, aimId: null };
  addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key.toLowerCase() === 'p' && state === 'play') paused = !paused; });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  cvs.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  cvs.addEventListener('mousedown', () => mouse.down = true);
  addEventListener('mouseup', () => mouse.down = false);
  addEventListener('blur', () => { mouse.down = false; for (const k in keys) keys[k] = false; });
  cvs.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.clientX < W / 2 && touch.moveId === null) { touch.moveId = t.identifier; touch.mx0 = t.clientX; touch.my0 = t.clientY; touch.mdx = touch.mdy = 0; }
      else if (touch.aimId === null) { touch.aimId = t.identifier; mouse.x = t.clientX; mouse.y = t.clientY; mouse.down = true; }
    }
  }, { passive: false });
  cvs.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === touch.moveId) { touch.mdx = t.clientX - touch.mx0; touch.mdy = t.clientY - touch.my0; }
      else if (t.identifier === touch.aimId) { mouse.x = t.clientX; mouse.y = t.clientY; }
    }
  }, { passive: false });
  const endTouch = e => {
    for (const t of e.changedTouches) {
      if (t.identifier === touch.moveId) { touch.moveId = null; touch.mdx = touch.mdy = 0; }
      if (t.identifier === touch.aimId) { touch.aimId = null; mouse.down = false; }
    }
  };
  cvs.addEventListener('touchend', endTouch); cvs.addEventListener('touchcancel', endTouch);

  // ---------- Game state ----------
  let state = 'menu', paused = false;
  let player, bullets, enemyBullets, enemies, particles, pickups, stars;
  let score, wave, waveTimer, spawnQueue, spawnTimer, shake, lastT;

  function reset() {
    player = { x: W / 2, y: H / 2, r: 14, hp: 100, speed: 280, cd: 0, inv: 0, triple: 0, rapid: 0, angle: 0 };
    bullets = []; enemyBullets = []; enemies = []; particles = []; pickups = [];
    stars = Array.from({ length: 120 }, () => ({ x: rand(0, W), y: rand(0, H), z: rand(0.2, 1) }));
    score = 0; wave = 0; shake = 0; spawnQueue = 0; spawnTimer = 0; waveTimer = 0;
    nextWave(); updateHud();
  }

  function nextWave() {
    wave++; spawnQueue = 5 + wave * 3; spawnTimer = 0.5; waveTimer = 2;
    $('wave').textContent = wave;
    beep(440, 0.15, 'triangle', 0.06, 440);
  }

  const TYPES = {
    grunt:   { r: 13, hp: 2,  speed: 95,  color: '#ff2bd6', pts: 10 },
    runner:  { r: 9,  hp: 1,  speed: 190, color: '#FFD23F', pts: 15 },
    tank:    { r: 24, hp: 10, speed: 55,  color: '#ff5a3c', pts: 50 },
    shooter: { r: 14, hp: 3,  speed: 70,  color: '#9b6bff', pts: 30 },
  };

  function spawnEnemy() {
    const roll = Math.random();
    let type = 'grunt';
    if (wave >= 2 && roll < 0.3) type = 'runner';
    if (wave >= 3 && roll > 0.85) type = 'tank';
    if (wave >= 4 && roll > 0.65 && roll <= 0.85) type = 'shooter';
    const t = TYPES[type], side = Math.floor(Math.random() * 4), m = 40;
    const x = side === 0 ? -m : side === 1 ? W + m : rand(0, W);
    const y = side === 2 ? -m : side === 3 ? H + m : rand(0, H);
    const scale = 1 + (wave - 1) * 0.06;
    enemies.push({ type, x, y, r: t.r, hp: Math.ceil(t.hp * (1 + (wave - 1) * 0.15)), speed: t.speed * Math.min(scale, 1.8),
      color: t.color, pts: t.pts, cd: rand(1, 2.5), flash: 0, wob: rand(0, 6.28) });
  }

  function burst(x, y, color, n = 14, sp = 220) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), s = rand(sp * 0.3, sp);
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.3, 0.7), max: 0.7, color, size: rand(1.5, 3.5) });
    }
  }

  function shoot() {
    const a = player.angle, spread = player.triple > 0 ? [-0.18, 0, 0.18] : [0];
    for (const o of spread) {
      bullets.push({ x: player.x + Math.cos(a) * 18, y: player.y + Math.sin(a) * 18,
        vx: Math.cos(a + o) * 720, vy: Math.sin(a + o) * 720, life: 1.2 });
    }
    player.cd = player.rapid > 0 ? 0.07 : 0.15;
    beep(880, 0.05, 'square', 0.025, -400);
  }

  function hurt(dmg) {
    if (player.inv > 0) return;
    player.hp -= dmg; player.inv = 0.6; shake = 10;
    burst(player.x, player.y, '#00e5ff', 18);
    beep(140, 0.25, 'sawtooth', 0.08, -80);
    if (player.hp <= 0) gameOver();
  }

  function gameOver() {
    state = 'over';
    burst(player.x, player.y, '#00e5ff', 60, 400);
    if (score > best) { best = score; try { localStorage.setItem('neonArenaBest', best); } catch (e) {} }
    $('best').textContent = best;
    $('overText').innerHTML = `Điểm: <b>${score}</b> · Đợt: <b>${wave}</b><br>Kỷ lục: <b>${best}</b>`;
    setTimeout(() => $('over').classList.remove('hidden'), 700);
  }

  function updateHud() {
    $('score').textContent = score;
    $('hpfill').style.width = Math.max(0, player.hp) + '%';
  }

  // ---------- Update ----------
  function update(dt) {
    for (const s of stars) { s.y += s.z * 20 * dt; if (s.y > H) { s.y = 0; s.x = rand(0, W); } }
    if (state !== 'play') { updateParticles(dt); return; }

    // movement
    let dx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
    let dy = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0);
    if (touch.moveId !== null) { dx = clamp(touch.mdx / 50, -1, 1); dy = clamp(touch.mdy / 50, -1, 1); }
    const len = Math.hypot(dx, dy);
    if (len > 1) { dx /= len; dy /= len; }
    player.x = clamp(player.x + dx * player.speed * dt, player.r, W - player.r);
    player.y = clamp(player.y + dy * player.speed * dt, player.r, H - player.r);
    player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    player.cd -= dt; player.inv -= dt; player.triple -= dt; player.rapid -= dt;
    if (mouse.down && player.cd <= 0) shoot();

    // waves
    if (waveTimer > 0) waveTimer -= dt;
    else if (spawnQueue > 0) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) { spawnEnemy(); spawnQueue--; spawnTimer = Math.max(0.15, 0.9 - wave * 0.05); }
    } else if (enemies.length === 0) nextWave();

    // bullets
    for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; }
    bullets = bullets.filter(b => b.life > 0 && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);
    for (const b of enemyBullets) {
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (dist2(b, player) < (player.r + 5) ** 2) { b.life = 0; hurt(10); }
    }
    enemyBullets = enemyBullets.filter(b => b.life > 0);

    // enemies
    for (const e of enemies) {
      const a = Math.atan2(player.y - e.y, player.x - e.x);
      e.wob += dt * 4;
      let sp = e.speed;
      if (e.type === 'shooter') {
        const d = Math.sqrt(dist2(e, player));
        sp = d < 220 ? -e.speed : d > 300 ? e.speed : 0;
        e.cd -= dt;
        if (e.cd <= 0) {
          e.cd = rand(1.4, 2.4);
          enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260, life: 3 });
          beep(300, 0.08, 'triangle', 0.03);
        }
      }
      const side = e.type === 'runner' ? Math.sin(e.wob) * 0.6 : 0;
      e.x += Math.cos(a + side) * sp * dt; e.y += Math.sin(a + side) * sp * dt;
      e.flash -= dt;

      for (const b of bullets) {
        if (b.life > 0 && dist2(b, e) < (e.r + 4) ** 2) {
          b.life = 0; e.hp--; e.flash = 0.08;
          burst(b.x, b.y, e.color, 4, 120);
          beep(520, 0.03, 'square', 0.02);
        }
      }
      if (e.hp > 0 && dist2(e, player) < (e.r + player.r) ** 2) {
        hurt(e.type === 'tank' ? 25 : 15);
        e.hp = 0; e.noScore = true;
      }
    }
    for (const e of enemies) if (e.hp <= 0) {
      burst(e.x, e.y, e.color, e.type === 'tank' ? 40 : 18, e.type === 'tank' ? 340 : 240);
      if (!e.noScore) {
        score += e.pts; shake = Math.max(shake, e.type === 'tank' ? 8 : 3);
        beep(e.type === 'tank' ? 90 : 200, 0.15, 'sawtooth', 0.05, -120);
        if (Math.random() < 0.09) {
          const kinds = ['hp', 'triple', 'rapid'];
          pickups.push({ x: e.x, y: e.y, kind: kinds[Math.floor(Math.random() * 3)], life: 9, t: 0 });
        }
      }
    }
    enemies = enemies.filter(e => e.hp > 0);
    bullets = bullets.filter(b => b.life > 0);

    // pickups
    for (const p of pickups) {
      p.life -= dt; p.t += dt;
      if (dist2(p, player) < (player.r + 12) ** 2) {
        p.life = 0;
        if (p.kind === 'hp') player.hp = Math.min(100, player.hp + 30);
        if (p.kind === 'triple') player.triple = 10;
        if (p.kind === 'rapid') player.rapid = 8;
        burst(p.x, p.y, PICK_COLORS[p.kind], 20);
        beep(660, 0.12, 'triangle', 0.06, 600);
      }
    }
    pickups = pickups.filter(p => p.life > 0);

    updateParticles(dt);
    shake = Math.max(0, shake - dt * 30);
    updateHud();
  }
  const PICK_COLORS = { hp: '#7CFF6B', triple: '#FFD23F', rapid: '#ff2bd6' };

  function updateParticles(dt) {
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.95; p.vy *= 0.95; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
  }

  // ---------- Render ----------
  function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }

  function render() {
    ctx.fillStyle = 'rgba(7,7,15,0.45)';
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));

    // grid + stars
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(0,229,255,0.05)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x < W; x += 48) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = 0; y < H; y += 48) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
    for (const s of stars) { ctx.fillStyle = `rgba(200,230,255,${s.z * 0.6})`; ctx.fillRect(s.x, s.y, s.z * 2, s.z * 2); }

    if (player) {
      // pickups
      for (const p of pickups) {
        if (p.life < 2 && Math.floor(p.t * 10) % 2) continue;
        const c = PICK_COLORS[p.kind]; glow(c, 16);
        ctx.fillStyle = c; ctx.beginPath(); ctx.arc(p.x, p.y, 8 + Math.sin(p.t * 6) * 2, 0, Math.PI * 2); ctx.fill();
      }
      // bullets
      glow('#00e5ff', 12); ctx.fillStyle = '#bff8ff';
      for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2); ctx.fill(); }
      glow('#9b6bff', 12); ctx.fillStyle = '#e2d4ff';
      for (const b of enemyBullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI * 2); ctx.fill(); }
      // enemies
      for (const e of enemies) {
        const c = e.flash > 0 ? '#ffffff' : e.color;
        glow(e.color, 18); ctx.strokeStyle = c; ctx.lineWidth = 2.5;
        ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.wob * (e.type === 'tank' ? 0.2 : 0.6));
        const sides = e.type === 'runner' ? 3 : e.type === 'tank' ? 6 : e.type === 'shooter' ? 5 : 4;
        ctx.beginPath();
        for (let i = 0; i <= sides; i++) {
          const a = (i / sides) * Math.PI * 2;
          i ? ctx.lineTo(Math.cos(a) * e.r, Math.sin(a) * e.r) : ctx.moveTo(Math.cos(a) * e.r, Math.sin(a) * e.r);
        }
        ctx.stroke();
        ctx.fillStyle = c + '33'; ctx.fill();
        ctx.restore();
      }
      // player
      if (state === 'play' && !(player.inv > 0 && Math.floor(player.inv * 20) % 2)) {
        const c = player.rapid > 0 ? '#ff2bd6' : player.triple > 0 ? '#FFD23F' : '#00e5ff';
        glow(c, 22); ctx.strokeStyle = c; ctx.lineWidth = 3;
        ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
        ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(-12, -13); ctx.lineTo(-6, 0); ctx.lineTo(-12, 13); ctx.closePath();
        ctx.stroke(); ctx.fillStyle = c + '44'; ctx.fill();
        ctx.restore();
      }
    }
    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max); glow(p.color, 8);
      ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    ctx.shadowBlur = 0;

    // wave banner / pause
    ctx.textAlign = 'center'; ctx.fillStyle = '#e8f1ff';
    if (state === 'play' && waveTimer > 0) {
      ctx.globalAlpha = Math.min(1, waveTimer); glow('#ff2bd6', 20);
      ctx.font = '800 44px system-ui, sans-serif'; ctx.fillText('WAVE ' + wave, W / 2, H / 2 - 60);
      ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    }
    if (paused) { ctx.font = '800 40px system-ui, sans-serif'; ctx.fillText('TẠM DỪNG', W / 2, H / 2); }
    // touch joystick hint
    if (touch.moveId !== null) {
      ctx.strokeStyle = 'rgba(0,229,255,.4)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(touch.mx0, touch.my0, 50, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(touch.mx0 + clamp(touch.mdx, -50, 50), touch.my0 + clamp(touch.mdy, -50, 50), 18, 0, Math.PI * 2); ctx.stroke();
    }
  }

  function loop(t) {
    const dt = Math.min(0.033, (t - (lastT || t)) / 1000); lastT = t;
    if (!paused) update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function start() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    $('menu').classList.add('hidden'); $('over').classList.add('hidden');
    reset(); paused = false; state = 'play';
  }
  $('startBtn').onclick = start;
  $('againBtn').onclick = start;
  stars = Array.from({ length: 120 }, () => ({ x: rand(0, W), y: rand(0, H), z: rand(0.2, 1) }));
  particles = [];
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
